name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Setup Android environment
        uses: android-actions/setup-android@v4.0.4

      - name: Fix gradlew permission
        run: chmod +x ./gradlew

      # 唯一的正式发布工作流，ci 段就取它的运行序号
      - name: Compute version
        id: version
        # 日期按 Asia/Shanghai 取值，并优先用本次提交的时间：跨日重试同一个提交
        # 仍然是同一个版本。PR 与手动触发没有 head_commit，回落到当前时间。
        run: |
          stamp="${{ github.event.head_commit.timestamp }}"
          if [ -z "$stamp" ]; then stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; fi
          day="$(TZ=Asia/Shanghai date -d "$stamp" +%y.%-m.%-d)"
          echo "name=$day.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build dictionary
        id: dict
        run: |
          set -o pipefail
          python3 scripts/build_dict.py 2>&1 | tee dict.log

      - name: Build debug APK
        id: apk
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # The sandbox that drives this repo cannot reach the Actions log endpoint,
      # so output is echoed back through commit comments, which are readable
      # with api.github.com. Remove these two steps once the build is stable.
      - name: Report dictionary output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s dict.log ]; then
            {
              echo "dictionary step: ${{ steps.dict.outcome }}"
              echo '```'
              tail -c 6000 dict.log
              echo '```'
              if [ -f build.log ]; then
                echo '### ranking probe'
                grep -E 'DICTDEBUG|TRADDEBUG' build.log | head -20
              fi
              echo '### version'
              echo "${{ steps.version.outputs.name }}  versionCode=${{ steps.version.outputs.code }}"
              echo '### apk'
              for apk in app/build/outputs/apk/debug/*.apk; do
                [ -f "$apk" ] || continue
                echo "$(ls -l "$apk" | awk '{printf "%.1f MB", $5/1048576}')  $apk"
          python3 - "$apk" <<'PYEOF' || true
          import re, sys, zipfile
          # the manifest string pool is utf-16, so strings(1) misses it
          with zipfile.ZipFile(sys.argv[1]) as z:
              raw = z.read("AndroidManifest.xml")
          for enc in ("utf-16-le", "utf-8"):
              found = re.search(r"\d{2}\.\d{1,2}\.\d{1,2}\.\d+", raw.decode(enc, "replace"))
              if found:
                  print("versionName inside apk:", found.group(0))
                  break
          else:
              print("versionName inside apk: not found")
          PYEOF
              done
            } > /tmp/dict.txt
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/dict.txt
          fi

      - name: Report build failure
        if: failure() && steps.apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "APK build failed on $(git rev-parse --short HEAD)"
            echo '### test failures'
            python3 -c "import glob, xml.etree.ElementTree as ET; [print(c.get('name'), '->', (f.get('message') or '')[:500].replace(chr(10), ' ')) for p in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True) for c in ET.parse(p).getroot().iter('testcase') for f in c.findall('failure')]"
            echo '### compiler errors'
            grep -E '^(e:|w:)|error:|Unresolved reference|Script compilation|DICTDEBUG|FAILED|expected:|Exception|at sumicya' build.log | head -80
            echo
            echo '### gradle failure digest'
            awk '/^FAILURE: Build failed/,0' build.log | grep -vE '^\s+at ' | head -60
          } > /tmp/fail.txt
          head -c 60000 /tmp/fail.txt > /tmp/fail-trim.txt
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/fail-trim.txt
