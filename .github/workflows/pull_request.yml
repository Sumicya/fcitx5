name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Fix gradlew permission
        run: chmod +x ./gradlew

      - name: Build dictionary
        id: dict
        run: |
          set -o pipefail
          python3 scripts/build_dict.py 2>&1 | tee dict.log

      - name: Build debug APK
        id: apk
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # The sandbox that drives this repo cannot reach the Actions log endpoint,
      # so output is echoed back through commit comments, which are readable
      # with api.github.com. Remove these two steps once the build is stable.
      - name: Report dictionary output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s dict.log ]; then
            { echo "dictionary step: ${{ steps.dict.outcome }}"; echo '```'; tail -c 6000 dict.log; echo '```'; } > /tmp/dict.txt
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/dict.txt
          fi

      - name: Report build failure
        if: failure() && steps.apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "APK build failed on $(git rev-parse --short HEAD)"
            echo '### compiler errors'
            grep -E '^(e:|w:)|error:|Unresolved reference|Script compilation|FAILED|expected:|AssertionError' build.log | head -60
            echo
            echo '### gradle failure digest'
            awk '/^FAILURE: Build failed/,0' build.log | grep -vE '^\s+at ' | head -60
          } > /tmp/fail.txt
          head -c 60000 /tmp/fail.txt > /tmp/fail-trim.txt
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/fail-trim.txt
