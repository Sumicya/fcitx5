name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Fix gradlew permission
        run: chmod +x ./gradlew

      - name: Build dictionary
        run: python3 scripts/build_dict.py --explore

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # The sandbox that drives this repo cannot reach the Actions log endpoint,
      # so the failure tail is posted as a commit comment where it can be read
      # back through api.github.com.
      - name: Report failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "CI failed on $(git rev-parse --short HEAD)"
            echo '### compiler errors'
            grep -E '^(e:|w:)|error:|Unresolved reference|Script compilation' build.log | head -60
            echo
            echo '### gradle failure digest'
            awk '/^FAILURE: Build failed/,0' build.log | grep -vE '^\s+at ' | head -60
            echo
            echo '### causes'
            grep -E 'Caused by:|Execution failed|What went wrong|Could not|Cannot|Failed to' build.log | head -40
          } > /tmp/fail.txt
          head -c 60000 /tmp/fail.txt > /tmp/fail-trim.txt
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/fail-trim.txt
